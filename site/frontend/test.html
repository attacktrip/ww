<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест - Гарант-Бот</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .test-info h2 {
            color: #ff6b9d;
        }
        .test-info code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h2>Режим тестирования</h2>
        <p>Эта страница используется для тестирования без Telegram.</p>
        <p>Для полноценной работы откройте <code>index.html</code> через Telegram Mini App.</p>
        <p><a href="index.html" style="color: #ff6b9d;">Перейти к приложению →</a></p>
    </div>
    
    <script>
        // Симуляция Telegram.WebApp для тестирования
        window.Telegram = {
            WebApp: {
                ready: function() {},
                expand: function() {},
                initData: 'test_data',
                initDataUnsafe: {
                    user: {
                        id: 123456789,
                        username: 'test_user',
                        first_name: 'Test',
                        last_name: 'User',
                        photo_url: ''
                    }
                }
            }
        };
        
        // Перенаправляем на основное приложение через 1 секунду
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    </script>
</body>
</html>
